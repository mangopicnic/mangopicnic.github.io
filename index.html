<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>망고피크닉 Mango Picnic</title>
<meta name="description" content="오리들이 나오는 작고 귀여운 게임을 만드는 1인 스튜디오, 망고피크닉입니다.">
<style>
	:root { --bg:#fffaf0; --card:#ffffff; --text:#3b2f22; --muted:#7a6a58; --line:#ecdcbf; --accent:#e58a1f; }
	@media (prefers-color-scheme: dark) { :root { --bg:#1f1b16; --card:#2a241d; --text:#f2e8d8; --muted:#b8a890; --line:#3d342a; --accent:#f4a23c; } }
	* { box-sizing: border-box; }
	body { margin:0; background:var(--bg); color:var(--text); font:16px/1.7 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
	main { max-width:720px; margin:0 auto; padding:48px 16px 64px; }
	h1 { font-size:32px; margin:0 0 4px; }
	.sub { color:var(--muted); margin:0 0 36px; }
	h2 { font-size:18px; color:var(--accent); margin:36px 0 12px; }
	.game { display:flex; gap:16px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:12px; }
	.game img { width:80px; height:80px; border-radius:18px; flex:none; }
	.game h3 { margin:0; font-size:18px; }
	.game p { margin:2px 0 6px; color:var(--muted); font-size:14px; }
	a { color:var(--accent); }
	.links a { margin-right:14px; font-size:14px; white-space:nowrap; }
	footer { margin-top:48px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
	<h1>🥭 망고피크닉</h1>
	<p class="sub">오리들이 나오는 작고 귀여운 게임을 만듭니다. · Mango Picnic, a tiny indie game studio.</p>

	<h2>게임 Games</h2>
	<div class="game">
		<img src="img/duck-guards.png" alt="오리 수비대 아이콘">
		<div>
			<h3>오리 수비대 Duck Guards</h3>
			<p>오리를 소환하고 합쳐서 빵을 지키는 랜덤 합성 디펜스</p>
			<div class="links">
				<a href="https://play.google.com/store/apps/details?id=com.mangopicnic.duckguards">Google Play</a>
				<a href="duck-guards/privacy.html">개인정보처리방침</a>
			</div>
		</div>
	</div>
	<div class="game">
		<img src="img/duck-ruckus.png" alt="오리 우당탕 아이콘">
		<div>
			<h3>오리 우당탕 Duck Ruckus</h3>
			<p>친구들과 함께 하는 오리 파티 게임 (준비 중)</p>
			<div class="links">
				<a href="duck-ruckus/privacy.html">개인정보처리방침</a>
			</div>
		</div>
	</div>

	<h2>문의 Contact</h2>
	<p><a href="mailto:mangopicnic.games@gmail.com">mangopicnic.games@gmail.com</a></p>

	<footer>© 2026 망고피크닉 Mango Picnic</footer>
</main>
</body>
</html>
